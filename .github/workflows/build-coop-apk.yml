name: Experimental cooperative RPC Android APK

on:
  workflow_dispatch:
    inputs:
      base_run_id:
        description: 'Prior verified Vulkan/CPU APK workflow run ID'
        required: false
        default: '45093723277'
  push:
    paths:
      - '.github/workflows/build-coop-apk.yml'
      - 'settings.gradle'
      - 'scripts/build_rpc_cpu.sh'
      - 'app/src/main/java/**'
      - 'tests/CloudRequestAdviceTest.java'
      - 'tests/CloudProviderOverviewTest.java'
      - 'tests/WorkspaceDictationPolicyTest.java'
      - 'tests/WorkspaceReadPolicyTest.java'
      - 'tests/WorkbenchLayoutPolicyTest.java'
      - 'tests/WorkbenchVisualPolicyTest.java'
      - 'tests/CloudViewportPolicyTest.java'
      - 'tests/CoopCapacityAdviceTest.java'
      - 'tests/ModelResourceAdviceTest.java'
      - 'tests/KnowledgeAnswerPolicyTest.java'
      - 'tests/KnowledgeImportPolicyTest.java'
      - 'tests/ProjectReportHandoffTest.java'
      - 'tests/ProjectContextTest.java'
      - 'tests/ProjectChatLinkTest.java'
      - 'tests/KnowledgeLibraryTest.java'
      - 'tests/KnowledgeWorkspacePolicyTest.java'
      - 'tests/RpcSocketRegistryTest.java'
      - 'tests/SecureRpcTransportTest.java'
      - 'app/src/main/java/com/ollamapocket/app/DistributedRunner.java'
      - 'app/src/main/java/com/ollamapocket/app/SecureRpcTransport.java'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/ollamapocket/app/MainActivity.java'
      - 'app/src/main/java/com/ollamapocket/app/SolarTheme.java'
      - 'tests/SolarThemeTest.java'
      - 'app/src/main/java/com/ollamapocket/app/ModelSearchCache.java'
      - 'app/src/main/java/com/ollamapocket/app/ModelDownloadBudget.java'
      - 'app/src/main/java/com/ollamapocket/app/ModelGroupings.java'
      - 'app/src/main/java/com/ollamapocket/app/BenchmarkRecommendation.java'
      - 'tests/ModelExperienceTest.java'
      - 'tests/CoopMemoryPlannerTest.java'
      - 'tests/BenchmarkStatsTest.java'
      - 'tests/PerformanceHudMetricsTest.java'
      - 'tests/ModelListFilterTest.java'
      - 'tests/ModelPerformanceAdvisorTest.java'
      - 'tests/ModelTileCatalogTest.java'
      - 'tests/DeviceRecommendationGridTest.java'
      - 'tests/OllamaQuantCatalogTest.java'
      - 'app/src/main/java/com/ollamapocket/app/OllamaQuantCatalog.java'
      - 'app/src/main/java/com/ollamapocket/app/OllamaQuantPicker.java'
      - 'app/src/main/java/com/ollamapocket/app/OllamaFamilyPicker.java'
      - 'app/src/main/java/com/ollamapocket/app/OllamaLibrarySearch.java'
      - 'tests/OllamaLibrarySearchTest.java'
      - 'tests/ModelVariantCatalogTest.java'
      - 'app/src/main/java/com/ollamapocket/app/ModelVariantCatalog.java'
      - 'app/src/main/java/com/ollamapocket/app/ModelTileCatalog.java'
      - 'app/src/main/res/anim/**'
      - 'app/src/main/res/values/**'
      - 'app/src/main/java/com/ollamapocket/app/ModelListFilter.java'
      - 'app/src/main/java/com/ollamapocket/app/ModelPerformanceAdvisor.java'
      - 'app/src/main/java/com/ollamapocket/app/ModelBenchmark.java'
      - 'app/src/main/java/com/ollamapocket/app/HuggingFaceCatalog.java'
      - 'app/src/main/java/com/ollamapocket/app/PerformanceHud*.java'
      - 'app/src/main/java/com/ollamapocket/app/BenchmarkStats.java'
      - 'app/src/main/res/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'scripts/release_audit.py'
      - 'tests/test_release_audit.py'

jobs:
  secure-relay-unit-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test AES-GCM loopback tunnel
        run: |
          mkdir -p /tmp/coop-tests
          javac -d /tmp/coop-tests \
            app/src/main/java/com/ollamapocket/app/SecureRpcTransport.java \
            tests/SecureRpcTransportTest.java
          java -cp /tmp/coop-tests SecureRpcTransportTest
          javac -d /tmp/coop-tests app/src/main/java/com/ollamapocket/app/RpcSocketRegistry.java tests/RpcSocketRegistryTest.java
          java -cp /tmp/coop-tests com.ollamapocket.app.RpcSocketRegistryTest
      - name: Test live-RAM budget and RPC split planner (pure Java)
        run: |
          mkdir -p /tmp/coop-tests
          javac -d /tmp/coop-tests \
            app/src/main/java/com/ollamapocket/app/CoopMemoryPlanner.java \
            tests/CoopMemoryPlannerTest.java
          java -cp /tmp/coop-tests CoopMemoryPlannerTest
      - name: Test benchmark math and HUD parsers (pure Java)
        run: |
          javac -d /tmp/coop-tests \
            app/src/main/java/com/ollamapocket/app/BenchmarkStats.java \
            tests/BenchmarkStatsTest.java \
            app/src/main/java/com/ollamapocket/app/PerformanceHudMetrics.java \
            tests/PerformanceHudMetricsTest.java
          java -cp /tmp/coop-tests BenchmarkStatsTest
          java -cp /tmp/coop-tests PerformanceHudMetricsTest
      - name: Test model family quantization and performance suitability
        run: |
          javac -d /tmp/coop-tests \
            app/src/main/java/com/ollamapocket/app/ModelListFilter.java \
            tests/ModelListFilterTest.java \
            app/src/main/java/com/ollamapocket/app/ModelPerformanceAdvisor.java \
            tests/ModelPerformanceAdvisorTest.java
          java -cp /tmp/coop-tests ModelListFilterTest
          java -cp /tmp/coop-tests ModelPerformanceAdvisorTest
      - name: Verify model grid status, recommendations and dynamic installation
        shell: bash
        run: |
          set -euo pipefail
          javac -d /tmp/coop-tests \
            app/src/main/java/com/ollamapocket/app/ModelTileCatalog.java \
            tests/ModelTileCatalogTest.java
          java -cp /tmp/coop-tests ModelTileCatalogTest
      - name: Verify six-device-recommendation grid selection
        shell: bash
        run: |
          set -euo pipefail
          javac -d /tmp/coop-tests \
            app/src/main/java/com/ollamapocket/app/ModelTileCatalog.java \
            tests/DeviceRecommendationGridTest.java
          java -cp /tmp/coop-tests DeviceRecommendationGridTest
      - name: Test real registry model-tag quantization parsing
        run: |
          javac -d /tmp/coop-tests \
            app/src/main/java/com/ollamapocket/app/OllamaQuantCatalog.java \
            tests/OllamaQuantCatalogTest.java
          java -cp /tmp/coop-tests OllamaQuantCatalogTest
      - name: Verify online Ollama model discovery parser (no fabricated results)
        run: |
          javac -d /tmp/coop-tests \
            app/src/main/java/com/ollamapocket/app/OllamaLibrarySearch.java \
            tests/OllamaLibrarySearchTest.java
          java -cp /tmp/coop-tests OllamaLibrarySearchTest
      - name: Verify exact quantization discovery, size ranking and responsive grid
        run: |
          javac -d /tmp/coop-tests \
            app/src/main/java/com/ollamapocket/app/OllamaLibrarySearch.java \
            app/src/main/java/com/ollamapocket/app/ModelVariantCatalog.java \
            tests/ModelVariantCatalogTest.java
          java -cp /tmp/coop-tests ModelVariantCatalogTest

      - name: Verify offline astronomical sunset theme
        run: |
          javac -d /tmp/coop-tests \
            app/src/main/java/com/ollamapocket/app/SolarTheme.java \
            tests/SolarThemeTest.java
          java -cp /tmp/coop-tests SolarThemeTest
      - name: Verify search caching, model grouping, download budget and measured ranking
        run: |
          javac -d /tmp/coop-tests \
            app/src/main/java/com/ollamapocket/app/OllamaLibrarySearch.java \
            app/src/main/java/com/ollamapocket/app/ModelVariantCatalog.java \
            app/src/main/java/com/ollamapocket/app/ModelSearchCache.java \
            app/src/main/java/com/ollamapocket/app/ModelDownloadBudget.java \
            app/src/main/java/com/ollamapocket/app/ModelGroupings.java \
            app/src/main/java/com/ollamapocket/app/BenchmarkRecommendation.java \
            tests/ModelExperienceTest.java
          java -cp /tmp/coop-tests ModelExperienceTest

  cooperative-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: secure-relay-unit-test
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Fetch pinned CPU/Vulkan base APK
        uses: actions/download-artifact@v4
        with:
          name: AI-in-Pocket-Vulkan-GPU-APK
          run-id: ${{ inputs.base_run_id || '45093723277' }}
          github-token: ${{ github.token }}
          path: base_apk
      - name: Extract CPU + GPU base payload
        shell: bash
        run: |
          set -euo pipefail
          apk="$(ls base_apk/*.apk | head -1)"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          for lib in libollama.so libllama-server.so libdeviceprobe.so libllama-vulkan-server.so; do
            unzip -p "$apk" "lib/arm64-v8a/$lib" > "app/src/main/jniLibs/arm64-v8a/$lib"
            test -s "app/src/main/jniLibs/arm64-v8a/$lib"
          done
          unzip -Z1 "$apk" | grep '^assets/licenses/' | while IFS= read -r entry; do
            case "$entry" in */) continue ;; esac
            mkdir -p "app/src/main/$(dirname "$entry")"
            unzip -p "$apk" "$entry" > "app/src/main/$entry"
          done
      - name: Build pinned Android llama.cpp CPU RPC host and worker
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build_rpc_cpu.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Provision stable signing key (when repository secrets are configured)
        shell: bash
        env:
          AI_POCKET_KEYSTORE_BASE64: ${{ secrets.AI_POCKET_KEYSTORE_BASE64 }}
          AI_POCKET_KEYSTORE_PASSWORD: ${{ secrets.AI_POCKET_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${AI_POCKET_KEYSTORE_BASE64:-}" ] && [ -n "${AI_POCKET_KEYSTORE_PASSWORD:-}" ]; then
            signing_file="$RUNNER_TEMP/aiinpocket-stable.p12"
            printf '%s' "$AI_POCKET_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
            chmod 600 "$signing_file"
            echo "AI_POCKET_KEYSTORE_FILE=$signing_file" >> "$GITHUB_ENV"
            echo "AI_POCKET_KEYSTORE_PASSWORD=$AI_POCKET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "AI_POCKET_STABLE_SIGNING=1" >> "$GITHUB_ENV"
            echo "::notice::Stable signing key is configured"
          else
            echo "::warning::Repository signing secrets are not set: this run uses ephemeral Android Debug signing. Do not use this APK to update a previously signed version."
          fi
      - name: Verify sidebar-only navigation source (no fixed bottom tabs)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('app/src/main/java/com/ollamapocket/app/MainActivity.java').read_text()
          assert 'showNavigationDrawer()' in src
          assert 'allSavedConversations()' in src
          import xml.etree.ElementTree as ET
          from pathlib import Path
          resource_root=Path("app/src/main/res")
          locales=["values","values-ko","values-b+zh+Hans","values-b+zh+Hant","values-ja"]
          keys=None
          for locale in locales:
              entries={e.attrib["name"]:e.text for e in ET.parse(resource_root/locale/"strings.xml").getroot().findall("string")}
              assert all(entries.values()), locale
              assert entries["app_name"] == "OnHand AI", locale
              assert keys is None or keys == set(entries), locale
              keys=set(entries)
              for key in ("models","settings","devices"):
                  assert 'drawerNavigationItem(getString(R.string.'+key+'))' in src, key
                  assert key in keys, locale
          assert 'drawerNavigationItem(String title)' in src
          drawer_fn=src.split('private TextView drawerNavigationItem(String title)',1)[1].split('private void showNavigationDrawer()',1)[0]
          assert 'TextView item=text(title,14,WHITE,active)' in drawer_fn
          assert 'text(mark+' not in drawer_fn
          assert 'item.setBackground(bg(active?FIELD:BG,10))' in drawer_fn
          assert 'if(radius>0&&(color==CARD||color==FIELD))' not in src
          assert 'BUBBLE=Color.rgb(243,244,246)' in src
          assert 'profile.setOnClickListener' not in src
          assert 'dp(300),Math.max(dp(228)' in src
          assert 'SolarTheme.isNight(' in src
          assert 'switchAutoThemeWithoutRestart()' in src
          assert 'UiText.cityLabels(this)' in src and 'SolarTheme.CITY_CODES[index]' in src
          assert 'searchCache.get(' in src
          assert 'fetchSearchSource(' in src
          assert 'renderGroupedSearch(' in src
          assert 'ModelDownloadBudget.requiredBytes(' in src
          assert 'ModelDownloadBudget.layerLabel(' in src
          assert 'downloadRetryButton.setVisibility(' in src
          assert 'BenchmarkRecommendation.adjustment(' in src
          assert 'getString("ui_theme","light")' in src
          assert 'new String[]{getString(R.string.theme_light_default),getString(R.string.theme_dark),getString(R.string.theme_auto_detail)}' in src
          assert 'navButtons' not in src
          assert 'private void showChatList()' not in src
          assert 'buildModelTile(' in src
          assert 'buildModelListRow(' in src
          assert 'setModelViewMode(' in src
          assert 'model_list_view' in src
          assert 'selectedSource="전체에서 찾기"' in src
          assert 'Arrays.asList("전체에서 찾기","Ollama에서 찾기","Hugging Face에서 찾기")' in src
          assert '직접 모델 다운로드' not in src
          assert 'manualDownloadPanel.setVisibility(View.GONE)' in src
          assert 'cancelPullButton.setVisibility(View.VISIBLE)' in src
          assert 'Button importButton=button(getString(R.string.import_gguf),false)' in src
          assert 'if(modelListView){' in src
          assert 'deviceRecommendedTiles()' in src
          assert 'ModelTileCatalog.forDevice(' in src
          assert 'new LinearLayout.LayoutParams(sidePx,sidePx)' in src
          assert 'ModelVariantCatalog.columns(' in src
          assert 'HuggingFaceCatalog.searchVariants(' in src
          assert 'ModelVariantCatalog.searchOllama(' in src
          assert 'ModelVariantCatalog.compareSize(' in src
          assert 'OllamaQuantPicker.show(' in src
          assert '모델 받기 ↓' not in src
          assert 'text(getString(R.string.model_recommend_mark),10,secondary,true)' in src
          assert 'bestQuantizations(' in src
          assert 'allSearchTiles(filter)' in src
          assert 'onlineSearchSerial' in src
          assert 'onModelSearchChanged(s.toString())' in src
          assert 'downloadingCardId' in src
          assert '이 기기에 추천하는 모델' not in src
          assert 'recommendationRows' not in src
          assert 'renderRecommendations' not in src
          assert 'WindowInsets.Type.statusBars()' in src
          assert 'performanceHudView.setText(identity+' in src
          assert 'updateTileDownloadProgress()' in src
          assert 'AiPocketDrawerMotion' in src
          assert 'ViewPropertyAnimator' not in src or 'animate()' in src
          print('PASS: drawer navigation, max-six square device models, dynamic HUD, statusbar safe-area')
          PY
      - name: Compile app with cooperative session and RPC tunnel
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify that host, worker and prior inference binaries are packaged
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          for lib in libollama.so libllama-server.so libdeviceprobe.so libllama-vulkan-server.so \
                     libggml-rpc-worker.so libllama-distributed-server.so; do
            unzip -l "$apk" | grep -F "lib/arm64-v8a/$lib"
          done
          unzip -t "$apk" | tail -2
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          signer="$sdk/build-tools/35.0.0/apksigner"
          aapt="$sdk/build-tools/35.0.0/aapt"
          "$signer" verify --verbose --print-certs "$apk" | tee signature-report.txt
          grep -Eq '^Verified using v2 scheme.*: true' signature-report.txt
          "$aapt" dump badging "$apk" | grep -F "package: name='io.github.tomorrowisfire.aiinpocket'"
          expected_version=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+)[[:space:]]*$/\1/p' app/build.gradle)
          test -n "$expected_version"
          "$aapt" dump badging "$apk" | grep -F "versionCode='$expected_version'"
          # The installed app retains its existing package ID; never silently reinstall.
          grep -F "applicationId 'io.github.tomorrowisfire.aiinpocket'" app/build.gradle
          grep -F 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          if [ "${AI_POCKET_STABLE_SIGNING:-0}" = "1" ]; then
            # Fingerprint of the user's known update-compatible v0.10.1 signature.
            expected='527d7a07ebe11d0519e2105bd6c400bc52c59a44d7e29f743bf782a8627991a6'
            if ! grep -iq "$expected" signature-report.txt; then
              echo "::error::Signing certificate differs from the installed update key."
              exit 1
            fi
            echo 'Update-compatible signature fingerprint verified.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::APK uses an ephemeral debug certificate. Do not install over the user's fixed-signed app."
          fi
          "$aapt" dump badging "$apk" | grep -F "application: label='OnHand AI'"
          "$aapt" dump badging "$apk" | grep -F "targetSdkVersion:'36'"
          unzip -l "$apk" | grep -E 'res/(mipmap|drawable)' >/dev/null
          sha256sum "$apk"
          echo "## Build-only verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Java, encryption, safe RAM, benchmark, HUD, model filtering and suitability unit tests passed. Android hardware inference and model downloads are not validated on devices." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish installation artifact
        shell: bash
        run: |
          mkdir -p dist
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([0-9]+\.[0-9]+\.[0-9]+).*'/\1/p" app/build.gradle | head -1)
          test -n "$version"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/OnHand-AI-v${version}-Cooperative-ARM64.apk"
          cp signature-report.txt dist/signature-report.txt
      - name: Make official Android apksigner available for offline stable re-signing
        shell: bash
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p signing-tools
          cp "$sdk/build-tools/35.0.0/lib/apksigner.jar" signing-tools/
          cp "$sdk/build-tools/35.0.0/apksigner" signing-tools/
          cp "$sdk/build-tools/35.0.0/zipalign" signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: AI-in-Pocket-Official-Signing-Tools
          path: signing-tools/*
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: AI-in-Pocket-Cooperative-RPC-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Audit release candidate prerequisites and complete native payload
        run: python3 -m unittest discover -s tests -p test_release_audit.py
      - name: Build unsigned QA bundle (sample ad ID, not for Play submission)
        env:
          AI_POCKET_KEYSTORE_FILE: ''
          AI_POCKET_KEYSTORE_PASSWORD: ''
          ADMOB_APP_ID: ''
        run: gradle --no-daemon :app:bundleRelease -PONHAND_UNSIGNED_QA=true
      - name: Audit all packaged ARM64 native ELF segments and stored APK alignment
        shell: bash
        run: |
          set +e
          mkdir -p release-audit
          python3 scripts/release_audit.py app/build/outputs/apk/debug/app-debug.apk --report release-audit/apk-16k.json
          apk_result=$?
          python3 scripts/release_audit.py app/build/outputs/bundle/release/app-release.aab --report release-audit/aab-16k.json
          aab_result=$?
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk > release-audit/zipalign.txt 2>&1
          zip_result=$?
          printf 'APK=%s AAB=%s ZIPALIGN=%s\n' "$apk_result" "$aab_result" "$zip_result" | tee release-audit/status.txt
          printf '%s\n' "$GITHUB_SHA" > release-audit/commit.txt
          cp signature-report.txt release-audit/signature-report.txt
          test "$apk_result" = 0 && test "$aab_result" = 0 && test "$zip_result" = 0
      - name: Upload 16 KB audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnHand-Release-Compatibility-Audit
          path: release-audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified fixed-signed update APK
        if: success() && env.AI_POCKET_STABLE_SIGNING == '1'
        uses: actions/upload-artifact@v4
        with:
          name: AI-in-Pocket-Stable-Update-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned QA-only app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnHand-QA-UNSIGNED-NOT-FOR-PLAY
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
