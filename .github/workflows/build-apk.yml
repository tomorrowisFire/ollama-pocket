name: Build AI in Pocket Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
      - '*.gradle'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout Ollama Pocket
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -e
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk" || { echo "::error::Android SDK not found: $sdk"; exit 1; }
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android platform + NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          cmake --version
          ninja --version

      - name: Checkout Ollama Android runtime fork
        uses: actions/checkout@v4
        with:
          repository: RadekParek/Rllama
          ref: main
          path: runtime
          persist-credentials: false
          submodules: recursive

      - name: Set up Go matching Ollama source
        uses: actions/setup-go@v5
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum

      - name: Compile native Ollama and llama.cpp (ARM64 Android)
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export OLLAMA_ANDROID_JNI_LIBS_DIR="$GITHUB_WORKSPACE/app/src/main/jniLibs"
          cd runtime
          bash scripts/build_android.sh -a arm64-v8a
          file "$OLLAMA_ANDROID_JNI_LIBS_DIR/arm64-v8a/"*.so

      - name: Compile native Android CPU-GPU-NPU device probe
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$CC" -fPIC -O2 -shared -Wl,-z,max-page-size=16384 -o app/src/main/jniLibs/arm64-v8a/libdeviceprobe.so app/src/main/cpp/deviceprobe.c -ldl
          file app/src/main/jniLibs/arm64-v8a/libdeviceprobe.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Include upstream open-source license notices
        shell: bash
        run: |
          set -eu
          mkdir -p app/src/main/assets/licenses
          if [ -f runtime/LICENSE ]; then cp runtime/LICENSE app/src/main/assets/licenses/Rllama-LICENSE.txt; fi
          if [ -d runtime/android/app/src/main/assets/licenses ]; then
            cp -R runtime/android/app/src/main/assets/licenses/. app/src/main/assets/licenses/
          fi
          cp LICENSE app/src/main/assets/licenses/App-MIT-0-LICENSE.txt
          cp NOTICE.txt app/src/main/assets/licenses/App-NOTICE.txt

      - name: Compile Android app
        run: gradle --no-daemon :app:assembleDebug

      - name: Confirm embedded ARM64 inference payload
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libollama.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libllama-server.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libdeviceprobe.so'
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare named APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AI-in-Pocket-v0.3.0-android-arm64.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-in-Pocket-Android-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
