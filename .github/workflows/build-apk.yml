name: Build AI in Pocket Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
      - '*.gradle'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout Ollama Pocket
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -e
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk" || { echo "::error::Android SDK not found: $sdk"; exit 1; }
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android platform + NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          cmake --version
          ninja --version

      - name: Checkout Ollama Android runtime fork
        uses: actions/checkout@v4
        with:
          repository: RadekParek/Rllama
          ref: main
          path: runtime
          persist-credentials: false
          submodules: recursive

      - name: Set up Go matching Ollama source
        uses: actions/setup-go@v5
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum

      - name: Compile native Ollama and llama.cpp (ARM64 Android)
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export OLLAMA_ANDROID_JNI_LIBS_DIR="$GITHUB_WORKSPACE/app/src/main/jniLibs"
          cd runtime
          bash scripts/build_android.sh -a arm64-v8a
          file "$OLLAMA_ANDROID_JNI_LIBS_DIR/arm64-v8a/"*.so

      - name: Compile native Android CPU-GPU-NPU device probe
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$CC" -fPIC -O2 -shared -Wl,-z,max-page-size=16384 -o app/src/main/jniLibs/arm64-v8a/libdeviceprobe.so app/src/main/cpp/deviceprobe.c -ldl
          file app/src/main/jniLibs/arm64-v8a/libdeviceprobe.so

      - name: Install optional Vulkan build tools
        shell: bash
        continue-on-error: true
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends glslc libvulkan-dev spirv-headers ninja-build

      - name: Attempt real Vulkan GPU runner build (optional, CPU fallback)
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          if timeout 1800 bash scripts/build_vulkan_gpu.sh > "$RUNNER_TEMP/gpu-build.log" 2>&1; then
            echo "::notice::Vulkan GPU runner is included in this APK"
            file app/src/main/jniLibs/arm64-v8a/libllama-vulkan-server.so
          else
            echo "::warning::Vulkan GPU runner build failed; shipping verified CPU Ollama only."
            grep -E 'error:|Error|CMake Error|FAILED|not found' "$RUNNER_TEMP/gpu-build.log" | tail -n 24 || true
            tail -n 50 "$RUNNER_TEMP/gpu-build.log" || true
            rm -f app/src/main/jniLibs/arm64-v8a/libllama-vulkan-server.so
          fi

      - name: Include Vulkan build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-vulkan-build-log
          path: ${{ runner.temp }}/gpu-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Include upstream open-source license notices
        shell: bash
        run: |
          set -eu
          mkdir -p app/src/main/assets/licenses
          if [ -f runtime/LICENSE ]; then cp runtime/LICENSE app/src/main/assets/licenses/Rllama-LICENSE.txt; fi
          if [ -d runtime/android/app/src/main/assets/licenses ]; then
            cp -R runtime/android/app/src/main/assets/licenses/. app/src/main/assets/licenses/
          fi
          if [ -f vulkan-build/llama.cpp/LICENSE ]; then
            cp vulkan-build/llama.cpp/LICENSE app/src/main/assets/licenses/llama-cpp-MIT-LICENSE.txt
          fi
          cp LICENSE app/src/main/assets/licenses/App-MIT-0-LICENSE.txt
          cp NOTICE.txt app/src/main/assets/licenses/App-NOTICE.txt

      - name: Compile Android app
        run: gradle --no-daemon :app:assembleDebug

      - name: Confirm embedded ARM64 inference payload
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libollama.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libllama-server.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libdeviceprobe.so'
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libllama-vulkan-server.so'; then
            echo "Vulkan backend included; actual GPU offload checked on device"
          else
            echo "CPU-only build (GPU backend unavailable)"
          fi
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare named APK
        run: |
          mkdir -p dist
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([0-9]+\.[0-9]+\.[0-9]+).*'/\1/p" app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::Unable to read versionName from app/build.gradle"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "dist/AI-in-Pocket-v${version}-android-arm64.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-in-Pocket-Android-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
