name: Experimental Vulkan GPU APK (reuse verified CPU payload)

on:
  workflow_dispatch:
    inputs:
      base_run_id:
        description: 'Successful CPU APK workflow run ID'
        required: false
        default: '45092779774'
  push:
    paths:
      - 'scripts/build_vulkan_gpu.sh'
      - 'scripts/android_vulkan_toolchain.cmake'
      - '.github/workflows/build-gpu-apk.yml'

jobs:
  vulkan-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Reuse already-compiled trusted CPU Android APK
        uses: actions/download-artifact@v4
        with:
          name: AI-in-Pocket-Android-APK
          run-id: ${{ inputs.base_run_id || '45092779774' }}
          github-token: ${{ github.token }}
          path: base_apk
      - name: Extract original Ollama and NNAPI probe payload
        shell: bash
        run: |
          set -euxo pipefail
          apk="$(ls base_apk/*.apk | head -1)"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          for f in libollama.so libllama-server.so libdeviceprobe.so; do
            unzip -p "$apk" "lib/arm64-v8a/$f" > "app/src/main/jniLibs/arm64-v8a/$f"
            test -s "app/src/main/jniLibs/arm64-v8a/$f"
          done
          unzip -Z1 "$apk" | grep '^assets/licenses/' | while IFS= read -r entry; do
            case "$entry" in */) continue ;; esac
            mkdir -p "app/src/main/$(dirname "$entry")"
            unzip -p "$apk" "$entry" > "app/src/main/$entry"
          done
      - name: Install Vulkan GPU compilation dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends glslc libvulkan-dev spirv-headers ninja-build build-essential
          dpkg -L spirv-headers | grep -E 'SPIRV-HeadersConfig.cmake|spirv-headers-config.cmake' || true
      - name: Compile Android ARM64 Vulkan llama.cpp (must succeed)
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build_vulkan_gpu.sh
      - name: Build pinned embedded Whisper and neural TTS runtimes
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build_whisper.sh
          bash scripts/build_neural_tts.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK including CPU Ollama + Vulkan llama.cpp
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify all CPU/GPU modules are embedded
        shell: bash
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          for lib in libollama.so libllama-server.so libdeviceprobe.so libllama-vulkan-server.so; do
            unzip -l "$apk" | grep "lib/arm64-v8a/$lib"
          done
          sha256sum "$apk"
      - name: Name Vulkan experimental APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AI-in-Pocket-v0.4.0-hardware-selftest-arm64-Vulkan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AI-in-Pocket-Vulkan-GPU-APK
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error
