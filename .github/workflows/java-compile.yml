          "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Java without native Ollama/Vulkan compilation
        run: gradle --no-daemon :app:compileDebugJavaWithJavac -x :app:checkNativePayload -x :app:checkComputeProbe -x :app:checkVoicePayload
      - name: Compile typed neural speech adapter against pinned upstream Android AAR (no packaging)
        shell: bash
        run: |
          set -euo pipefail
          aar="$RUNNER_TEMP/sherpa-onnx-2.0.3.aar"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 --proto '=https' --proto-redir '=https' -o "$aar" https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar
          test "$(stat -c%s "$aar")" = 52411426
          echo "4c766e2e74c9d33d595338c21fe3b305c73ba45d47e96a235675c33142a2ec50  $aar" | sha256sum -c -
          gradle --no-daemon :app:compileDebugJavaWithJavac -x :app:checkNativePayload -x :app:checkComputeProbe -x :app:checkVoicePayload -PONHAND_NEURAL_VOICE_AAR="$aar"
          test -n "$(find app/build -name SherpaNeuralVoice.class -print -quit)"
          echo 'PASS: typed Whisper and Supertonic adapter compiled; no native execution or packaging'

  embedded-voice-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore SHA-256 pinned voice fixture jars
        uses: actions/cache@v4
        with:
          path: /tmp/onhand-voice-test-deps
          key: ${{ runner.os }}-onhand-voice-jars-v1-${{ hashFiles('scripts/test_voice_models.sh', 'scripts/fetch_pinned_test_jar.sh') }}
      - name: Test actual Whisper model and native cancellation on host
        shell: bash
        run: bash scripts/test_whisper_host.sh
      - name: Test actual Korean English Japanese neural TTS and JNI on host
        shell: bash
        run: bash scripts/test_neural_tts_host.sh

  vision-inference-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore SHA-256 pinned voice fixture jars
        uses: actions/cache@v4
        with:
          path: /tmp/onhand-voice-test-deps
          key: ${{ runner.os }}-onhand-voice-jars-v1-${{ hashFiles('scripts/test_voice_models.sh', 'scripts/fetch_pinned_test_jar.sh') }}
      - name: Verify pinned VLM archive and actual synthetic JPEG inference
        run: python3 scripts/test_vision_host.py
