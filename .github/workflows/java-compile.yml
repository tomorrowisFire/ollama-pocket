        run: |
          mkdir -p /tmp/local-stream-tests
          javac -cp /tmp/cloud-stream-tests/json.jar -d /tmp/local-stream-tests app/src/main/java/com/ollamapocket/app/LocalChatTurns.java app/src/main/java/com/ollamapocket/app/LocalStreamCancellation.java app/src/main/java/com/ollamapocket/app/LocalInferenceStream.java tests/LocalStreamCancellationTest.java tests/LocalInferenceStreamTest.java
