          javac --release 17 -d /tmp/vision-input-tests app/src/main/java/com/ollamapocket/app/VisionImagePolicy.java tests/VisionImagePolicyTest.java
          java -cp /tmp/vision-input-tests com.ollamapocket.app.VisionImagePolicyTest
