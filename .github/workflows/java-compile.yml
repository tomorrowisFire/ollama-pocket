env:
  ONHAND_VOICE_TEST_DEPS: /tmp/onhand-voice-test-deps

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore SHA-256 pinned voice fixture jars
        uses: actions/cache@v4
        with:
          path: /tmp/onhand-voice-test-deps
          key: ${{ runner.os }}-onhand-voice-jars-v1-${{ hashFiles('scripts/test_voice_models.sh', 'scripts/fetch_pinned_test_jar.sh') }}
      - name: Test pinned fixture mirror and cache integrity without network
        run: python3 -m unittest discover -s tests -p test_pinned_test_jar.py
      - name: Test stage-scoped native build policy
        run: python3 -m unittest discover -s tests -p test_native_build_scope.py
      - name: Test safe Markdown parser (pure Java)
        shell: bash
        run: |
          mkdir -p /tmp/chat-markup-tests
          javac -d /tmp/chat-markup-tests app/src/main/java/com/ollamapocket/app/ChatMarkup.java tests/ChatMarkupTest.java
          java -cp /tmp/chat-markup-tests com.ollamapocket.app.ChatMarkupTest
      - name: Test bounded rich answer blocks and simple formula rendering
        run: |
          mkdir -p /tmp/chat-block-tests
          javac -d /tmp/chat-block-tests app/src/main/java/com/ollamapocket/app/ChatBlocks.java app/src/main/java/com/ollamapocket/app/SimpleFormula.java tests/ChatBlocksTest.java
          java -cp /tmp/chat-block-tests com.ollamapocket.app.ChatBlocksTest
      - name: Guard first-run advertisement and production lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/ollamapocket/app')
          src=(root/'MainActivity.java').read_text()
          ads=(root/'AdSupport.java').read_text()
          guide=src.split('private void showFirstRunGuide() {',1)[1].split('private void startServer()',1)[0]
          assert 'ads.register(guideAd,AdSupport.PLACEMENT_ONBOARDING)' in guide
          assert 'ads.showBanner(guideAd)' in guide
          assert 'ads.detach(guideAd)' in guide
          assert 'guideAd.setVisibility(View.GONE)' not in guide
          assert guide.index('dialog.show();') < guide.index('ads.showBanner(guideAd)')
          assert 'LIVE_ONBOARDING_BANNER = "ca-app-pub-4763897710237099/9558835282"' in ads
          assert 'return BuildConfig.DEBUG && prefs.getBoolean("enabled", true)' in ads
          assert 'PLACEMENT_ONBOARDING.equals(placement) ? LIVE_ONBOARDING_BANNER' in ads
          assert '!consent.canRequestAds()' in ads
          print('PASS: first-run banner placement and unit preserved, production requests disabled')
          PY
      - name: Test cloud scope and authenticated encryption (pure Java)
        run: |
          mkdir -p /tmp/cloud-tests
          javac -d /tmp/cloud-tests app/src/main/java/com/ollamapocket/app/CloudHistory.java app/src/main/java/com/ollamapocket/app/CloudKeyCipher.java app/src/main/java/com/ollamapocket/app/PrivacyPolicy.java tests/CloudPolicyTest.java tests/CloudBranchTest.java
          java -cp /tmp/cloud-tests com.ollamapocket.app.CloudPolicyTest
          java -cp /tmp/cloud-tests com.ollamapocket.app.CloudBranchTest
      - name: Test responsive workspace policy (pure Java)
        run: |
          mkdir -p /tmp/workspace-tests
          javac -d /tmp/workspace-tests app/src/main/java/com/ollamapocket/app/WorkspaceLayoutPolicy.java app/src/main/java/com/ollamapocket/app/ChatWorkspacePolicy.java tests/WorkspaceLayoutPolicyTest.java tests/ChatWorkspacePolicyTest.java
          java -cp /tmp/workspace-tests com.ollamapocket.app.WorkspaceLayoutPolicyTest
          javac -cp /tmp/workspace-tests -d /tmp/workspace-tests app/src/main/java/com/ollamapocket/app/WorkbenchLayoutPolicy.java tests/WorkbenchLayoutPolicyTest.java
          java -cp /tmp/workspace-tests com.ollamapocket.app.WorkbenchLayoutPolicyTest
          javac -cp /tmp/workspace-tests -d /tmp/workspace-tests app/src/main/java/com/ollamapocket/app/WorkbenchVisualPolicy.java tests/WorkbenchVisualPolicyTest.java
          java -cp /tmp/workspace-tests com.ollamapocket.app.WorkbenchVisualPolicyTest
          javac -cp /tmp/workspace-tests -d /tmp/workspace-tests app/src/main/java/com/ollamapocket/app/CloudViewportPolicy.java tests/CloudViewportPolicyTest.java
          java -cp /tmp/workspace-tests com.ollamapocket.app.CloudViewportPolicyTest
          javac -cp /tmp/workspace-tests -d /tmp/workspace-tests app/src/main/java/com/ollamapocket/app/WorkspaceTextPolicy.java tests/WorkspaceTextPolicyTest.java tests/WorkspaceTextAnchorTest.java
          java -cp /tmp/workspace-tests com.ollamapocket.app.WorkspaceTextPolicyTest
          java -cp /tmp/workspace-tests com.ollamapocket.app.WorkspaceTextAnchorTest
          java -cp /tmp/workspace-tests com.ollamapocket.app.ChatWorkspacePolicyTest
      - name: Test diagnostic formatting and advisor display data (pure Java)
        run: |
          mkdir -p /tmp/diagnostic-tests
          javac -d /tmp/diagnostic-tests app/src/main/java/com/ollamapocket/app/DiagnosticValues.java app/src/main/java/com/ollamapocket/app/ModelPerformanceAdvisor.java tests/DiagnosticValuesTest.java tests/AdvisorDisplayDataTest.java tests/ModelPerformanceAdvisorTest.java
          java -cp /tmp/diagnostic-tests com.ollamapocket.app.DiagnosticValuesTest
          java -cp /tmp/diagnostic-tests com.ollamapocket.app.AdvisorDisplayDataTest
          java -cp /tmp/diagnostic-tests ModelPerformanceAdvisorTest
      - name: Test cooperative plan display data (pure Java)
        run: |
          mkdir -p /tmp/coop-plan-tests
          javac -d /tmp/coop-plan-tests app/src/main/java/com/ollamapocket/app/CoopMemoryPlanner.java tests/CoopMemoryPlannerTest.java tests/CoopPlanLocaleDataTest.java
          java -cp /tmp/coop-plan-tests CoopMemoryPlannerTest
          java -cp /tmp/coop-plan-tests CoopPlanLocaleDataTest
      - name: Test local chat branching and completed-turn context
        run: |
          mkdir -p /tmp/local-chat-tests
          javac -d /tmp/local-chat-tests app/src/main/java/com/ollamapocket/app/LocalChatTurns.java tests/LocalChatTurnsTest.java
          java -cp /tmp/local-chat-tests com.ollamapocket.app.LocalChatTurnsTest
      - name: Test local conversation search and export helpers
        run: |
          mkdir -p /tmp/chat-library-tests
          javac -d /tmp/chat-library-tests app/src/main/java/com/ollamapocket/app/LocalChatTurns.java app/src/main/java/com/ollamapocket/app/LocalChatLibrary.java app/src/main/java/com/ollamapocket/app/TransferReview.java tests/LocalChatLibraryTest.java tests/TransferReviewTest.java
          java -cp /tmp/chat-library-tests com.ollamapocket.app.LocalChatLibraryTest
          java -cp /tmp/chat-library-tests com.ollamapocket.app.TransferReviewTest
      - name: Test chat title and pin ordering
        run: |
          mkdir -p /tmp/chat-organization-tests
          javac -d /tmp/chat-organization-tests app/src/main/java/com/ollamapocket/app/ChatOrganization.java tests/ChatOrganizationTest.java
          java -cp /tmp/chat-organization-tests com.ollamapocket.app.ChatOrganizationTest
      - name: Test bounded local attachment text extraction
        run: |
          mkdir -p /tmp/attachment-tests
          javac -d /tmp/attachment-tests app/src/main/java/com/ollamapocket/app/LocalChatTurns.java app/src/main/java/com/ollamapocket/app/AttachmentText.java app/src/main/java/com/ollamapocket/app/OfficeText.java app/src/main/java/com/ollamapocket/app/PdfExcerpt.java app/src/main/java/com/ollamapocket/app/OcrPolicy.java app/src/main/java/com/ollamapocket/app/DocumentWindow.java app/src/main/java/com/ollamapocket/app/DocumentBatchPolicy.java tests/DocumentBatchPolicyTest.java tests/AttachmentTextTest.java tests/OfficeTextTest.java tests/PdfExcerptTest.java tests/OcrPolicyTest.java tests/DocumentWindowTest.java
          java -cp /tmp/attachment-tests com.ollamapocket.app.AttachmentTextTest
          java -cp /tmp/attachment-tests com.ollamapocket.app.OfficeTextTest
          java -cp /tmp/attachment-tests com.ollamapocket.app.PdfExcerptTest
          java -cp /tmp/attachment-tests com.ollamapocket.app.OcrPolicyTest
          java -cp /tmp/attachment-tests com.ollamapocket.app.DocumentWindowTest
          java -cp /tmp/attachment-tests com.ollamapocket.app.DocumentBatchPolicyTest
          javac -d /tmp/attachment-tests app/src/main/java/com/ollamapocket/app/DocumentRequestControl.java tests/DocumentRequestControlTest.java
          java -cp /tmp/attachment-tests com.ollamapocket.app.DocumentRequestControlTest
      - name: Test voice queue policy and Unicode boundaries
        run: |
          mkdir -p /tmp/voice-tests
          javac -d /tmp/voice-tests app/src/main/java/com/ollamapocket/app/VoiceQueuePolicy.java app/src/main/java/com/ollamapocket/app/VoiceInteractionPolicy.java tests/VoiceQueuePolicyTest.java tests/VoiceInteractionPolicyTest.java
          java -cp /tmp/voice-tests com.ollamapocket.app.VoiceQueuePolicyTest
          java -cp /tmp/voice-tests com.ollamapocket.app.VoiceInteractionPolicyTest
          javac -d /tmp/voice-tests app/src/main/java/com/ollamapocket/app/VoiceOfflinePolicy.java tests/VoiceOfflinePolicyTest.java
          java -cp /tmp/voice-tests com.ollamapocket.app.VoiceOfflinePolicyTest
          javac -d /tmp/voice-tests app/src/main/java/com/ollamapocket/app/NeuralVoicePolicy.java app/src/main/java/com/ollamapocket/app/VerifiedSpeechFiles.java tests/NeuralVoicePolicyTest.java
          java -cp /tmp/voice-tests com.ollamapocket.app.NeuralVoicePolicyTest
          javac -d /tmp/voice-tests app/src/main/java/com/ollamapocket/app/VoiceContinuation.java tests/VoiceContinuationTest.java
          java -cp /tmp/voice-tests com.ollamapocket.app.VoiceContinuationTest
          javac -cp /tmp/voice-tests -d /tmp/voice-tests app/src/main/java/com/ollamapocket/app/WorkspaceDictationPolicy.java tests/WorkspaceDictationPolicyTest.java
          java -cp /tmp/voice-tests com.ollamapocket.app.WorkspaceDictationPolicyTest
          javac -cp /tmp/voice-tests -d /tmp/voice-tests app/src/main/java/com/ollamapocket/app/WorkspaceReadPolicy.java tests/WorkspaceReadPolicyTest.java
          java -cp /tmp/voice-tests com.ollamapocket.app.WorkspaceReadPolicyTest
      - name: Test embedded voice admission, ownership and verified model installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/embedded-voice-tests
          javac -d /tmp/embedded-voice-tests app/src/main/java/com/ollamapocket/app/VoiceNativeWork.java tests/VoiceNativeWorkTest.java
          java -cp /tmp/embedded-voice-tests com.ollamapocket.app.VoiceNativeWorkTest
          javac -d /tmp/embedded-voice-tests app/src/main/java/com/ollamapocket/app/WhisperCapturePolicy.java tests/WhisperCapturePolicyTest.java
          java -cp /tmp/embedded-voice-tests com.ollamapocket.app.WhisperCapturePolicyTest
          javac -d /tmp/embedded-voice-tests app/src/main/java/com/ollamapocket/app/NeuralTtsPolicy.java tests/NeuralTtsPolicyTest.java
          java -cp /tmp/embedded-voice-tests com.ollamapocket.app.NeuralTtsPolicyTest
          bash scripts/test_voice_models.sh
      - name: Test cloud usage ledger and estimated spending policy
        run: |
          mkdir -p /tmp/cloud-usage-tests
          javac -d /tmp/cloud-usage-tests app/src/main/java/com/ollamapocket/app/CloudUsageLedger.java tests/CloudUsageLedgerTest.java
          java -cp /tmp/cloud-usage-tests com.ollamapocket.app.CloudUsageLedgerTest
      - name: Test API request review and projected session spending
        run: |
          javac -cp /tmp/cloud-usage-tests -d /tmp/cloud-usage-tests app/src/main/java/com/ollamapocket/app/CloudHistory.java app/src/main/java/com/ollamapocket/app/CloudRequestAdvice.java tests/CloudRequestAdviceTest.java
          java -cp /tmp/cloud-usage-tests com.ollamapocket.app.CloudRequestAdviceTest
      - name: Test credential, PDF cache and RPC socket ownership policies
        run: |
          mkdir -p /tmp/privacy-tests
          javac -d /tmp/privacy-tests app/src/main/java/com/ollamapocket/app/PrivacyPolicy.java app/src/main/java/com/ollamapocket/app/RpcSocketRegistry.java tests/PrivacyPolicyTest.java tests/RpcSocketRegistryTest.java
          java -cp /tmp/privacy-tests com.ollamapocket.app.PrivacyPolicyTest
          java -cp /tmp/privacy-tests com.ollamapocket.app.RpcSocketRegistryTest
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path("app/src/main")
          ns="{http://schemas.android.com/apk/res/android}"
          app=ET.parse(root/"AndroidManifest.xml").getroot().find("application")
          assert app.get(ns+"allowBackup")=="false"
          assert app.get(ns+"fullBackupContent")=="false"
          assert app.get(ns+"dataExtractionRules")=="@xml/onhand_data_extraction_rules"
          rules=ET.parse(root/"res/xml/onhand_data_extraction_rules.xml").getroot()
          expected={"root","file","database","sharedpref","external","device_root","device_file","device_database","device_sharedpref"}
          for section in ("cloud-backup","device-transfer"):
              assert {e.get("domain") for e in rules.find(section).findall("exclude") if e.get("path")=="."}==expected
          print("PASS: explicit backup and transfer exclusion rules")
          PY
      - name: Test offline SSE protocol fixtures
        run: |
          mkdir -p /tmp/cloud-stream-tests
          bash scripts/fetch_test_json.sh /tmp/cloud-stream-tests/json.jar
          javac -cp /tmp/cloud-stream-tests/json.jar -d /tmp/cloud-stream-tests app/src/main/java/com/ollamapocket/app/CloudApi.java app/src/main/java/com/ollamapocket/app/CloudHistory.java app/src/main/java/com/ollamapocket/app/PrivacyPolicy.java tests/CloudStreamTest.java
          java -cp /tmp/cloud-stream-tests:/tmp/cloud-stream-tests/json.jar com.ollamapocket.app.CloudStreamTest
      - name: Test API provider dashboard and bounded usage accounting
        run: |
          javac -cp /tmp/cloud-stream-tests:/tmp/cloud-stream-tests/json.jar:/tmp/cloud-usage-tests -d /tmp/cloud-stream-tests app/src/main/java/com/ollamapocket/app/CloudProviderOverview.java tests/CloudProviderOverviewTest.java
          java -cp /tmp/cloud-stream-tests:/tmp/cloud-stream-tests/json.jar:/tmp/cloud-usage-tests com.ollamapocket.app.CloudProviderOverviewTest
      - name: Test document snapshot and structured report
        run: |
          javac -cp /tmp/attachment-tests:/tmp/cloud-stream-tests/json.jar -d /tmp/attachment-tests app/src/main/java/com/ollamapocket/app/DocumentBatchReport.java tests/DocumentBatchReportTest.java
          java -cp /tmp/attachment-tests:/tmp/cloud-stream-tests/json.jar com.ollamapocket.app.DocumentBatchReportTest
      - name: Test independent strict tool JSON admission
        run: |
          mkdir -p /tmp/tool-json-tests
          javac --release 17 -d /tmp/tool-json-tests app/src/main/java/com/ollamapocket/app/ToolJsonPolicy.java tests/ToolJsonPolicyTest.java
          java -cp /tmp/tool-json-tests com.ollamapocket.app.ToolJsonPolicyTest
      - name: Test independent one-shot tool call approval and budget
