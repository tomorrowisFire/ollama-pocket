name: Android Java fast compile (without native engines)

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - '.github/workflows/java-compile.yml'
      - 'app/src/main/res/**'
      - 'tests/ChatMarkupTest.java'
      - 'tests/CloudPolicyTest.java'
      - 'tests/WorkspaceLayoutPolicyTest.java'
      - 'tests/DiagnosticValuesTest.java'
      - 'tests/AdvisorDisplayDataTest.java'
      - 'tests/CoopPlanLocaleDataTest.java'

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test safe Markdown parser (pure Java)
        shell: bash
        run: |
          mkdir -p /tmp/chat-markup-tests
          javac -d /tmp/chat-markup-tests app/src/main/java/com/ollamapocket/app/ChatMarkup.java tests/ChatMarkupTest.java
          java -cp /tmp/chat-markup-tests com.ollamapocket.app.ChatMarkupTest
      - name: Guard first-run advertisement and production lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/ollamapocket/app')
          src=(root/'MainActivity.java').read_text()
          ads=(root/'AdSupport.java').read_text()
          guide=src.split('private void showFirstRunGuide() {',1)[1].split('private void startServer()',1)[0]
          assert 'ads.register(guideAd,AdSupport.PLACEMENT_ONBOARDING)' in guide
          assert 'ads.showBanner(guideAd)' in guide
          assert 'ads.detach(guideAd)' in guide
          assert 'guideAd.setVisibility(View.GONE)' not in guide
          assert guide.index('dialog.show();') < guide.index('ads.showBanner(guideAd)')
          assert 'LIVE_ONBOARDING_BANNER = "ca-app-pub-4763897710237099/9558835282"' in ads
          assert 'return BuildConfig.DEBUG && prefs.getBoolean("enabled", true)' in ads
          assert 'PLACEMENT_ONBOARDING.equals(placement) ? LIVE_ONBOARDING_BANNER' in ads
          assert '!consent.canRequestAds()' in ads
          print('PASS: first-run banner placement and unit preserved, production requests disabled')
          PY
      - name: Test cloud scope and authenticated encryption (pure Java)
        run: |
          mkdir -p /tmp/cloud-tests
          javac -d /tmp/cloud-tests app/src/main/java/com/ollamapocket/app/CloudHistory.java app/src/main/java/com/ollamapocket/app/CloudKeyCipher.java tests/CloudPolicyTest.java
          java -cp /tmp/cloud-tests com.ollamapocket.app.CloudPolicyTest
      - name: Test responsive workspace policy (pure Java)
        run: |
          mkdir -p /tmp/workspace-tests
          javac -d /tmp/workspace-tests app/src/main/java/com/ollamapocket/app/WorkspaceLayoutPolicy.java tests/WorkspaceLayoutPolicyTest.java
          java -cp /tmp/workspace-tests com.ollamapocket.app.WorkspaceLayoutPolicyTest
      - name: Test diagnostic formatting and advisor display data (pure Java)
        run: |
          mkdir -p /tmp/diagnostic-tests
          javac -d /tmp/diagnostic-tests app/src/main/java/com/ollamapocket/app/DiagnosticValues.java app/src/main/java/com/ollamapocket/app/ModelPerformanceAdvisor.java tests/DiagnosticValuesTest.java tests/AdvisorDisplayDataTest.java tests/ModelPerformanceAdvisorTest.java
          java -cp /tmp/diagnostic-tests com.ollamapocket.app.DiagnosticValuesTest
          java -cp /tmp/diagnostic-tests com.ollamapocket.app.AdvisorDisplayDataTest
          java -cp /tmp/diagnostic-tests ModelPerformanceAdvisorTest
      - name: Test cooperative plan display data (pure Java)
        run: |
          mkdir -p /tmp/coop-plan-tests
          javac -d /tmp/coop-plan-tests app/src/main/java/com/ollamapocket/app/CoopMemoryPlanner.java tests/CoopMemoryPlannerTest.java tests/CoopPlanLocaleDataTest.java
          java -cp /tmp/coop-plan-tests CoopMemoryPlannerTest
          java -cp /tmp/coop-plan-tests CoopPlanLocaleDataTest
      - name: Verify OnHand AI brand and locale resource parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root=Path('app/src/main/res')
          baseline=None
          for name in ['values','values-ko','values-b+zh+Hans','values-b+zh+Hant','values-ja']:
              items=ET.parse(root/name/'strings.xml').getroot().findall('string')
              values={e.attrib['name']:e.text for e in items}
              assert len(values)==len(items) and all(values.values()),name
              assert values['app_name']=='OnHand AI',name
              tokens={k:sorted(re.findall(r'%\d+\$[ds]',v)) for k,v in values.items()}
              assert baseline is None or baseline==tokens,name
              baseline=tokens
          src=Path('app/src/main/java/com/ollamapocket/app')
          for path in src.glob('*.java'):
              assert 'On Hands AI' not in path.read_text(),path
              for k in re.findall(r'(?<!android\.)R\.string\.([a-z_][a-z0-9_]*)',path.read_text()):
                  assert k in baseline,(path,k)
          assert "applicationId 'io.github.tomorrowisfire.aiinpocket'" in Path('app/build.gradle').read_text()
          print('PASS: exact OnHand AI display name, five-locale parity and format arguments; application ID retained')
          PY
      - name: Android SDK
        shell: bash
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Java without native Ollama/Vulkan compilation
        run: gradle --no-daemon :app:compileDebugJavaWithJavac -x :app:checkNativePayload -x :app:checkComputeProbe
