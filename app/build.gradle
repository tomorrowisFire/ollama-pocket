plugins {
    id 'com.android.application'
}

def publisherAdMobAppId = (findProperty('ADMOB_APP_ID') ?: System.getenv('ADMOB_APP_ID') ?: '').toString()
def sampleAdMobAppId = 'ca-app-pub-3940256099942544~3347511713'
// Explicit unsigned QA bundle only; never activate live ad requests.
def unsignedQa = (findProperty('ONHAND_UNSIGNED_QA') ?: 'false').toString() == 'true'
// Optional durable signing identity provided ONLY through Actions secrets / environment.
// Never commit keystores or passwords to this public repository.
def localStore = System.getenv('AI_POCKET_KEYSTORE_FILE') ?: ''
def localPassword = System.getenv('AI_POCKET_KEYSTORE_PASSWORD') ?: ''
def stableSigning = localStore && localPassword && file(localStore).isFile() 

// Experimental neural speech adapter is compile-only; do not package unreviewed third-party binaries.
def neuralVoiceAar = (findProperty('ONHAND_NEURAL_VOICE_AAR') ?: '').toString()
if (neuralVoiceAar) {
    if (gradle.startParameter.taskNames != [':app:compileDebugJavaWithJavac']) {
        throw new GradleException('Neural voice AAR is permitted for the isolated Java compile only')
    }
    def aar = file(neuralVoiceAar)
    if (!aar.isFile() || aar.length() != 52411426L) throw new GradleException('Invalid pinned neural voice AAR size')
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    aar.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int n
        while ((n = stream.read(buffer)) != -1) digest.update(buffer, 0, n)
    }
    if (digest.digest().encodeHex().toString() != '4c766e2e74c9d33d595338c21fe3b305c73ba45d47e96a235675c33142a2ec50') {
        throw new GradleException('Invalid pinned neural voice AAR digest')
    }
}

android {
    if (neuralVoiceAar) {
        sourceSets.main.java.srcDir 'src/neuralVoice/java'
    }
    namespace 'com.ollamapocket.app'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.tomorrowisfire.aiinpocket'
        minSdk 26
        targetSdk 36
        versionCode 25
        versionName '0.12.0-dev'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (stableSigning) {
            durable {
                storeFile file(localStore)
                storePassword localPassword
                keyAlias 'aiinpocket'
                keyPassword localPassword
                storeType 'pkcs12'
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: sampleAdMobAppId]
            if (stableSigning) signingConfig signingConfigs.durable
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [admobAppId: unsignedQa ? sampleAdMobAppId : (publisherAdMobAppId ?: sampleAdMobAppId)]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
}

tasks.register('checkNativePayload') {
    doLast {
        def nativeDir = file('src/main/jniLibs/arm64-v8a')
        ['libollama.so', 'libllama-server.so'].each { name ->
            def f = new File(nativeDir, name)
            if (!f.isFile() || f.length() < 1000000) {
                throw new GradleException("Missing Android ARM64 Ollama runtime: ${f}. See README_ko.md")
            }
            def bytes = new byte[4]
            f.withInputStream { stream -> stream.read(bytes) }
            if (bytes[0] != 0x7f || bytes[1] != 69 || bytes[2] != 76 || bytes[3] != 70) {
                throw new GradleException("Not an ELF binary: ${f}")
            }
        }
    }
}
preBuild.dependsOn checkNativePayload

tasks.register('checkComputeProbe') {
    doLast {
        def probe = file('src/main/jniLibs/arm64-v8a/libdeviceprobe.so')
        if (!probe.isFile() || probe.length() < 3000) {
            throw new GradleException('Missing Android ARM64 NNAPI diagnostic probe: ' + probe)
        }
    }
}
preBuild.dependsOn checkComputeProbe

// Production requires the publisher's AdMob app ID (with ~), not an ad unit ID (with /).
tasks.register('verifyReleaseAdMobId') {
    doLast {
        if (unsignedQa) {
            logger.lifecycle('Unsigned QA bundle only: sample AdMob application ID, production ads locked')
            return
        }
        if (!(publisherAdMobAppId ==~ /ca-app-pub-[0-9]{16}~[0-9]{10}/)) {
            throw new GradleException('Release build requires ADMOB_APP_ID=ca-app-pub-<publisher>~<app>')
        }
    }
}
tasks.configureEach { t ->
    if (t.name == 'preReleaseBuild') t.dependsOn('verifyReleaseAdMobId')
}

// Official Google SDKs. Debug demo ads; release units supplied by publisher.
dependencies {
    if (neuralVoiceAar) {
        implementation files(neuralVoiceAar)
        implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    }
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    // Bundled OCR models: no first-use language model download is required.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
}
